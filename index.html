<!DOCTYPE html>
<html lang="ru" data-theme="noir-metal" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MRChix</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&family=Oswald:wght@500;600;700&family=UnifrakturMaguntia&display=swap" rel="stylesheet" />

  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5/colors/properties.css" rel="stylesheet" type="text/css" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <link rel="stylesheet" href="style.css" />
</head>

<body class="bg-base-100 text-base-content min-h-screen antialiased selection:bg-primary selection:text-primary-content">

  <header class="sticky top-0 z-50 border-b border-base-content/20 bg-base-100/90 backdrop-blur-md">
    <div class="navbar max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 min-h-16">

      <div class="navbar-start gap-2">
        <div class="dropdown lg:hidden">
          <button tabindex="0" type="button" aria-label="Menu" class="btn btn-ghost btn-sm px-2 text-base-content/80 hover:text-base-content">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
              <path stroke-linecap="square" d="M3 6h18M3 12h18M3 18h18" />
            </svg>
          </button>
          <ul tabindex="0" class="menu dropdown-content mt-3 w-56 bg-base-200 border border-base-content/20 p-2 font-mono text-xs uppercase tracking-widest shadow-2xl">
            <li><a href="#about" data-i18n="nav_about"></a></li>
            <li><a href="#interests" data-i18n="nav_interests"></a></li>
            <li><a href="#projects" data-i18n="nav_projects"></a></li>
            <li><a href="#contacts" data-i18n="nav_contacts"></a></li>
          </ul>
        </div>

        <a href="#" class="flex items-center gap-2.5 group">
          <span class="text-primary text-base select-none">†</span>
          <span class="font-display font-bold text-xl sm:text-2xl tracking-[0.22em] uppercase text-base-content group-hover:text-accent transition-colors" data-i18n="brand_alias"></span>
        </a>
      </div>

      <div class="navbar-center hidden lg:flex">
        <ul class="menu menu-horizontal gap-1 font-mono text-[11px] tracking-[0.18em] uppercase text-base-content/70">
          <li><a href="#about" class="hover:text-base-content hover:bg-base-200/80" data-i18n="nav_about"></a></li>
          <li><a href="#interests" class="hover:text-base-content hover:bg-base-200/80" data-i18n="nav_interests"></a></li>
          <li><a href="#projects" class="hover:text-base-content hover:bg-base-200/80" data-i18n="nav_projects"></a></li>
          <li><a href="#contacts" class="hover:text-base-content hover:bg-base-200/80" data-i18n="nav_contacts"></a></li>
        </ul>
      </div>

      <div class="navbar-end gap-3">
        <div class="join border border-base-content/20 bg-base-200">
          <button type="button" data-lang-btn="ru" class="join-item btn btn-xs font-mono tracking-wider px-2.5">RU</button>
          <button type="button" data-lang-btn="en" class="join-item btn btn-xs font-mono tracking-wider px-2.5">EN</button>
        </div>
      </div>

    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 pt-10 pb-20 lg:pt-16 space-y-24 lg:space-y-32">

    <section class="relative">
      <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 lg:gap-12 items-center">

        <div class="lg:col-span-7 order-2 lg:order-1 space-y-7">
          <div class="flex items-center gap-3 font-mono text-xs uppercase tracking-[0.25em] text-base-content/60">
            <span class="text-primary">✦</span>
            <span data-i18n="hero_kicker"></span>
            <span class="hidden sm:inline-block h-px w-12 bg-base-content/20"></span>
          </div>

          <h1 class="font-display text-5xl sm:text-6xl lg:text-7xl font-bold uppercase tracking-tight leading-[0.95] text-base-content" data-i18n="full_name"></h1>

          <div class="flex flex-wrap gap-4 pt-1">
            <a href="#contacts" class="btn btn-metal-primary px-7 font-mono text-xs uppercase tracking-[0.2em]">
              <span>†</span>
              <span data-i18n="btn_contact"></span>
            </a>
            <a data-link="github" href="#" target="_blank" rel="noopener noreferrer"
               class="btn btn-metal px-7 font-mono text-xs uppercase tracking-[0.2em]">
              <span data-i18n="btn_github"></span>
              <span>↗</span>
            </a>
          </div>
        </div>

        <div class="lg:col-span-5 order-1 lg:order-2">
          <div class="card-noir relative border border-base-content/20 bg-base-200 p-1.5">
            <div class="noir-photo-wrap aspect-[4/5] overflow-hidden group">
              <img src="images/hero.jpg" alt="Portrait"
                   class="w-full h-full object-cover object-[50%_35%] noir-photo group-hover:scale-105" />
            </div>
          </div>
        </div>

      </div>
    </section>

    <section id="about" class="space-y-10 scroll-mt-24">
      <div class="divider divider-start font-mono text-xs uppercase tracking-[0.25em] text-base-content/60">
        <span class="text-primary">†</span>
        <span data-i18n="about_heading"></span>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 lg:gap-10 items-center">

        <div class="lg:col-span-5">
          <div class="card-noir border border-base-content/20 bg-base-200 p-1.5">
            <div class="noir-photo-wrap aspect-[4/3] overflow-hidden group">
              <img src="images/dogs.jpg" alt="Forest with dogs"
                   class="w-full h-full object-cover object-center noir-photo group-hover:scale-105" />
            </div>
          </div>
        </div>

        <div class="lg:col-span-7 space-y-8">
          <div class="space-y-5 text-base-content/80 leading-relaxed text-sm sm:text-base">
            <h2 class="font-display text-3xl sm:text-4xl uppercase tracking-wide text-base-content" data-i18n="bio_title"></h2>
            <p data-i18n="bio_p1"></p>
            <p data-i18n="bio_p2"></p>
          </div>

          <div class="card-noir grid grid-cols-1 sm:grid-cols-3 border border-base-content/20 bg-base-200">
            <div class="p-5 border-b sm:border-b-0 sm:border-r border-base-content/20">
              <div class="font-mono text-[10px] uppercase tracking-[0.2em] text-base-content/50" data-i18n="edu_place_label"></div>
              <div class="text-sm font-medium text-base-content mt-2" data-i18n="edu_place_val"></div>
            </div>

            <div class="p-5 border-b sm:border-b-0 sm:border-r border-base-content/20">
              <div class="font-mono text-[10px] uppercase tracking-[0.2em] text-base-content/50" data-i18n="edu_major_label"></div>
              <div class="text-sm font-medium text-base-content mt-2" data-i18n="edu_major_val"></div>
            </div>

            <div class="p-5">
              <div class="font-mono text-[10px] uppercase tracking-[0.2em] text-base-content/50" data-i18n="edu_year_label"></div>
              <div class="text-sm font-medium text-base-content mt-2" data-i18n="edu_year_val"></div>
            </div>
          </div>
        </div>

      </div>
    </section>

    <section id="interests" class="space-y-10 scroll-mt-24">
      <div class="divider divider-start font-mono text-xs uppercase tracking-[0.25em] text-base-content/60">
        <span class="text-primary">†</span>
        <span data-i18n="interests_heading"></span>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-stretch">

        <div class="lg:col-span-8 card card-border card-noir bg-base-200 border-base-content/20 p-6 sm:p-7 space-y-5">
          <div class="flex items-center justify-between">
            <h2 class="font-display text-2xl sm:text-3xl uppercase tracking-wide" data-i18n="interests_title"></h2>
            <span class="font-mono text-xs text-base-content/40">✦</span>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-x-8 gap-y-4 pt-4 border-t border-base-content/10 text-sm text-base-content/85">
            <div class="flex items-start gap-3">
              <span class="text-primary text-xs mt-1">†</span>
              <span data-i18n="interest_1"></span>
            </div>
            <div class="flex items-start gap-3">
              <span class="text-primary text-xs mt-1">†</span>
              <span data-i18n="interest_2"></span>
            </div>
            <div class="flex items-start gap-3">
              <span class="text-primary text-xs mt-1">†</span>
              <span data-i18n="interest_3"></span>
            </div>
            <div class="flex items-start gap-3">
              <span class="text-primary text-xs mt-1">†</span>
              <span data-i18n="interest_4"></span>
            </div>
          </div>
        </div>

        <div class="lg:col-span-4 card card-border card-noir bg-base-200 border-base-content/20 p-6 sm:p-7 flex flex-col justify-between gap-6">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-2.5 font-mono text-[11px] uppercase tracking-[0.2em] text-accent">
              <span class="status status-primary animate-pulse"></span>
              <span data-i18n="music_label"></span>
            </div>
            <span class="text-base-content/40 text-sm">†</span>
          </div>

          <div class="space-y-3">
            <div class="font-gothic text-3xl sm:text-4xl text-base-content tracking-wide" data-music="main"></div>
            <div class="font-mono text-xs text-base-content/85 tracking-wider uppercase" data-music="others"></div>
            <p class="font-mono text-[11px] text-base-content/50 leading-relaxed pt-2 border-t border-base-content/10" data-i18n="music_genres"></p>
          </div>
        </div>

      </div>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">

        <div class="card-noir border border-base-content/20 bg-base-200 p-1.5">
          <div class="noir-photo-wrap aspect-[3/4] overflow-hidden group">
            <img src="images/moto-jump.jpg" alt="Enduro jump"
                 class="w-full h-full object-cover object-center noir-photo group-hover:scale-105" />
          </div>
        </div>

        <div class="card-noir border border-base-content/20 bg-base-200 p-1.5">
          <div class="noir-photo-wrap aspect-[3/4] overflow-hidden group">
            <img src="images/moto-forest.jpg" alt="Hard enduro in forest"
                 class="w-full h-full object-cover object-center noir-photo group-hover:scale-105" />
          </div>
        </div>

        <div class="card-noir border border-base-content/20 bg-base-200 p-1.5">
          <div class="noir-photo-wrap aspect-[3/4] overflow-hidden group">
            <img src="images/moto-stoppie.jpg" alt="Enduro stoppie"
                 class="w-full h-full object-cover object-center noir-photo group-hover:scale-105" />
          </div>
        </div>

      </div>
    </section>

    <section id="projects" class="space-y-10 scroll-mt-24">
      <div class="divider divider-start font-mono text-xs uppercase tracking-[0.25em] text-base-content/60">
        <span class="text-primary">†</span>
        <span data-i18n="projects_heading"></span>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

        <article class="card card-border card-noir bg-base-200 border-base-content/20 p-6 sm:p-8 flex flex-col justify-between gap-6 hover:border-accent/50 transition-colors">
          <div class="space-y-4">
            <div class="flex items-center justify-between font-mono text-[11px] uppercase tracking-[0.18em]">
              <span class="text-accent">01</span>
              <span class="text-base-content/50" data-i18n="proj1_status"></span>
            </div>

            <h3 class="font-display text-2xl sm:text-3xl uppercase tracking-wide text-base-content" data-i18n="proj1_title"></h3>
            <p class="text-sm text-base-content/75 leading-relaxed" data-i18n="proj1_desc"></p>
          </div>
        </article>

        <article class="card card-border card-noir bg-base-200 border-base-content/20 p-6 sm:p-8 flex flex-col justify-between gap-6 hover:border-accent/50 transition-colors">
          <div class="space-y-4">
            <div class="flex items-center justify-between font-mono text-[11px] uppercase tracking-[0.18em]">
              <span class="text-accent">02</span>
              <span class="text-base-content/50" data-i18n="proj2_status"></span>
            </div>

            <h3 class="font-display text-2xl sm:text-3xl uppercase tracking-wide text-base-content" data-i18n="proj2_title"></h3>
            <p class="text-sm text-base-content/75 leading-relaxed" data-i18n="proj2_desc"></p>
          </div>
        </article>

      </div>
    </section>

    <section id="contacts" class="space-y-10 scroll-mt-24">
      <div class="divider divider-start font-mono text-xs uppercase tracking-[0.25em] text-base-content/60">
        <span class="text-primary">†</span>
        <span data-i18n="contacts_heading"></span>
      </div>

      <div class="space-y-4">
        <h2 class="font-display text-3xl sm:text-5xl uppercase tracking-wide text-base-content" data-i18n="contacts_title"></h2>
        <p class="text-sm text-base-content/60 max-w-xl" data-i18n="contacts_sub"></p>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">

        <a data-link="github" href="#" target="_blank" rel="noopener noreferrer"
           class="btn btn-metal h-auto py-5 px-6 flex items-center justify-between text-left group">
          <div>
            <div class="font-mono text-[10px] tracking-[0.16em] text-base-content/50" data-handle="github"></div>
            <div class="font-display text-xl uppercase tracking-wider mt-0.5">GitHub</div>
          </div>
          <svg class="w-5 h-5 text-base-content/60 group-hover:text-base-content group-hover:translate-x-0.5 group-hover:-translate-y-0.5 transition-all" fill="currentColor" viewBox="0 0 24 24">
            <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/>
          </svg>
        </a>

        <a data-link="telegram" href="#" target="_blank" rel="noopener noreferrer"
           class="btn btn-metal h-auto py-5 px-6 flex items-center justify-between text-left group">
          <div>
            <div class="font-mono text-[10px] tracking-[0.16em] text-base-content/50" data-handle="telegram"></div>
            <div class="font-display text-xl uppercase tracking-wider mt-0.5">Telegram</div>
          </div>
          <svg class="w-5 h-5 text-base-content/60 group-hover:text-base-content group-hover:translate-x-0.5 group-hover:-translate-y-0.5 transition-all" fill="currentColor" viewBox="0 0 24 24">
            <path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/>
          </svg>
        </a>

        <a data-link="email" href="#"
           class="btn btn-metal h-auto py-5 px-6 flex items-center justify-between text-left group">
          <div>
            <div class="font-mono text-[10px] tracking-[0.12em] text-base-content/50" data-handle="email"></div>
            <div class="font-display text-xl uppercase tracking-wider mt-0.5">Email</div>
          </div>
          <svg class="w-5 h-5 text-base-content/60 group-hover:text-base-content group-hover:translate-x-0.5 group-hover:-translate-y-0.5 transition-all" fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24">
            <path stroke-linecap="square" d="M3 5h18v14H3V5zm0 0 9 7 9-7" />
          </svg>
        </a>

      </div>
    </section>

  </main>

  <footer class="border-t border-base-content/20 bg-base-200/40">
    <div class="footer sm:footer-horizontal items-center justify-between max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-8 font-mono text-xs text-base-content/50">
      <p data-i18n="footer_copy"></p>
      <p class="uppercase tracking-widest text-[10px]" data-i18n="footer_location"></p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
